[install]
saveTextLockfile = true
# Guarda de cadeia de suprimentos: ignora versões publicadas há menos de
# 7 dias. Pacote invadido costuma ser despublicado em horas ou poucos
# dias, então esperar é o que evita instalar a versão comprometida.
#
# ATENÇÃO ao mexer: este número está acoplado aos intervalos do
# package.json. Uma tentativa anterior de elevar para 7 dias derrubou o
# build porque o package.json pedia "@supabase/supabase-js": "^2.112.0"
# e TODAS as versões desse intervalo tinham menos de 7 dias — o bun
# respondeu "blocked by minimum-release-age" e o Netlify parou na
# instalação. O piso foi baixado para ^2.111.0, que já passou da idade.
#
# Antes de elevar de novo, ou de subir o piso de algum pacote, valide
# com:  bunx bun install --dry-run
minimumReleaseAge = 604800
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
