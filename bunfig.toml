[install]
saveTextLockfile = true
# Guarda de cadeia de suprimentos: ignora versões publicadas há menos de
# 24h. Pacote invadido costuma ser despublicado em horas, então mesmo
# essa janela curta já evita a maior parte dos casos.
#
# NÃO eleve para 604800 (7 dias). O scan de segurança sugere isso, mas
# derruba o build: o @supabase/supabase-js publica versões novas com
# frequência, e o ^2.112.0 do package.json ficou sem nenhuma versão
# elegível — "blocked by minimum-release-age" no log do Netlify.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
